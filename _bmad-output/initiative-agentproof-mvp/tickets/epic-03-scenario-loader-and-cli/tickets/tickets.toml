# Epic 3: Scenario loader and CLI. Table order is build order.

[[entry]]
id = 1
type = "story"
title = "Typer app with the error handler, exit-code module, and version command"
description = "Adds cli/app.py holding the only exit sites and the last-resort handler, cli/exit_codes.py with from_outcome and from_comparison, the version command printing package and Schema Versions, and the fault-injection hook gated by AGENTPROOF_TESTING."
verify = "agentproof version exits 0 printing the version and supported versions; agentproof validate missing.yaml exits 2 with one line; with fault injection enabled, version exits 4 with one line, and with --verbose also a traceback."
covers = ["R3", "R4"]
after = ["2.1", "2.4"]
hitl = false
risk = "medium"
references = ["_bmad-output/initiative-agentproof-mvp/architecture-agentproof/architecture-agentproof.md#ad-20--cli-contract"]

[[entry]]
id = 2
type = "story"
title = "Safe YAML loader"
description = "Adds loading.yaml_safe.load as a SafeLoader subclass rejecting custom tags, duplicate keys with key and line, aliases and anchors, and multi-document streams, with a fixture per rejection class including a billion-laughs document."
verify = "Each malformed fixture raises SuiteError naming the line; the billion-laughs fixture is rejected before any expansion is observable in memory; a plain Suite loads to a dict."
covers = ["R1"]
after = ["2.1"]
hitl = false
risk = "high"
references = ["_bmad-output/initiative-agentproof-mvp/architecture-agentproof/architecture-agentproof.md#ad-19--safe-parsing-and-input-limits"]

[[entry]]
id = 3
type = "story"
title = "Size-limited reading and parse_suite with every violation"
description = "Adds io.read_limited with the byte limit and symlink policy, parse_suite(text, source=) and load_suite(path) collecting every model violation into one SuiteError, and the Violation-to-line formatting the CLI prints."
verify = "A Suite with three independent errors yields one SuiteError with three Violations in field order; a 6 MB file is rejected before parsing naming the limit; a symlink out of the Suite directory is refused."
covers = ["R1"]
after = [1, 2, "2.2"]
hitl = false
risk = "medium"

[[entry]]
id = 4
type = "story"
title = "validate command end to end"
description = "Wires validate SUITE_PATH to load_suite, printing the Scenario and Assertion counts on success and one line per violation on failure, with --help listing exit codes."
verify = "validate on the spine's Suite seed exits 0; on each malformed fixture exits 2 with one line per violation and no traceback; agentproof validate --help names exit codes 0, 2, 4."
covers = ["R4", "R3"]
after = [1, 3]
hitl = false
risk = "low"

[[entry]]
id = 5
type = "story"
title = "Console scrubber and logging filter"
description = "Adds redaction.scrub_text with longest-first replacement by the marker, io.console wrapping rich output and installing a logging filter that applies it, and the --verbose and --no-color global options."
verify = "With a planted secret in secret_values, every captured line from print, log, and an error message shows [REDACTED] instead; --no-color output contains no ANSI escapes."
covers = ["R5"]
after = [3]
hitl = false
risk = "medium"
references = ["_bmad-output/initiative-agentproof-mvp/architecture-agentproof/architecture-agentproof.md#ad-10--redaction-at-ingress-one-rule-set-one-marker-one-scrubber"]

[[entry]]
id = 6
type = "story"
title = "init scaffolds the expense-agent example"
description = "Adds examples/expense-agent as the template source with the Suite from the spine seed and hand-written fixture Trace files, and the init [PATH] command that copies it, refuses to overwrite, and validates the result."
verify = "In an empty directory init then validate exits 0 with two Scenarios; a second init exits 2 naming agentproof.yaml; each fixture Trace file validates against the Trace model."
covers = ["R2", "R4"]
after = [4, "2.3"]
hitl = false
risk = "medium"

[[entry]]
id = 7
type = "story"
title = "Refactor sweep"
description = "Cleanup only, scoped at start from the plans and review findings of stories 1 to 6; no new behavior."
verify = "uv run check stays green and the diff touches only what the sweep scope lists."
covers = ["R4"]
