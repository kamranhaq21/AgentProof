# Epic 2: Data contracts and schema validation. Table order is build order.

[[entry]]
id = 1
type = "story"
title = "Constants, errors, common types, and the Canonical serializer"
description = "Adds constants (versions, id regex, device names, RFC 3339 regex, marker, size limits, statements), the error taxonomy with Violation, JsonValue and Status, and models.canonical with dumps, dumps_compact, and VOLATILE_PATHS, plus the first golden file."
verify = "dumps of the golden input matches tests/golden/canonical-1.json byte for byte on Linux and Windows CI, and dumps_compact of a nested object is one line with sorted keys."
covers = ["R4", "R6"]
after = ["1.3", "1.4"]
hitl = false
risk = "medium"
references = ["_bmad-output/initiative-agentproof-mvp/architecture-agentproof/architecture-agentproof.md#ad-11--canonical-form-compact-form-and-volatile-paths"]

[[entry]]
id = 2
type = "story"
title = "Suite, defaults, scenario, and assertion configuration models"
description = "Adds models.assertions with the six config models and the static discriminated union, and models.suite with Suite, SuiteDefaults, and Scenario, including the Assertion-id default, the scenario-id rules, the one-operator rule for tool_call_count, and min one Assertion."
verify = "model_validate of the spine's Suite seed succeeds and yields assertion ids tool_not_called-0 and tool_call_count-1; a duplicate id, an unknown type, a Reject/reject pair, and NUL each raise SuiteError naming the field path."
covers = ["R2", "R5"]
after = [1]
hitl = false
risk = "high"
references = ["_bmad-output/initiative-agentproof-mvp/architecture-agentproof/architecture-agentproof.md#ad-8--assertion-protocol-registry-and-the-one-yaml-shape"]

[[entry]]
id = 3
type = "story"
title = "Trace, event, capture, redaction-state, and environment models"
description = "Adds models.trace with the event type literal, the full event key set, string timestamps validated by the RFC 3339 regex, required Capture defaulting to unknown, RedactionState, the Environment allowlist, and contiguous seq validation."
verify = "The spine's Trace seed validates; a naive timestamp, a gap in seq, a duplicate seq, an unknown event type, and an environment key outside the allowlist each raise TraceFormatError naming the index or field."
covers = ["R1", "R5"]
after = [1]
hitl = false
risk = "high"
references = ["_bmad-output/initiative-agentproof-mvp/architecture-agentproof/architecture-agentproof.md#ad-5--trace-event-addressing-and-final-output"]

[[entry]]
id = 4
type = "story"
title = "Result, outcome, Report, and Comparison models"
description = "Adds AssertionResult, ScenarioResult, SuiteOutcome, Report with version, identity, counts, the SuiteDefaults snapshot, embedded Traces, and Comparison, matching the spine's Report seed."
verify = "The spine's Report seed validates, a Report with an unknown top-level key is rejected, and dumps of a Report places defaults, scenarios, and trace keys in sorted order."
covers = ["R3", "R5"]
after = [2, 3]
hitl = false
risk = "medium"

[[entry]]
id = 5
type = "story"
title = "Generated JSON Schemas, drift test, and schema v1 fixtures"
description = "Adds models.export_schemas, commits schemas/suite-v1, trace-v1, report-v1, a test that regenerates and diffs them, and the valid and invalid fixture archive under tests/fixtures/schema/v1 validated with jsonschema in tests only."
verify = "The drift test passes, editing a schema file by hand makes it fail, and every fixture under valid/ validates against its schema while every file under invalid/ fails with the error class its name states."
covers = ["R5", "R1", "R2", "R3"]
after = [4]
hitl = false
risk = "medium"
references = ["_bmad-output/initiative-agentproof-mvp/architecture-agentproof/architecture-agentproof.md#ad-4--json-schemas-are-generated-never-hand-edited"]

[[entry]]
id = 6
type = "story"
title = "Property tests for round trips, null versus absent, and non-finite numbers"
description = "Adds hypothesis strategies for JsonValue, Suite, Trace, and Report proving parse-dumps-parse identity, that null and absent optional fields are equivalent on input and every key is written on output, and that NaN and infinity are rejected."
verify = "The property suite passes with at least two hundred examples per model and a NaN in a tool argument raises a taxonomy error."
covers = ["R4", "R1", "R3"]
after = [4]
hitl = false
risk = "low"

[[entry]]
id = 7
type = "story"
title = "Refactor sweep"
description = "Cleanup only, scoped at start from the plans and review findings of stories 1 to 6; no new behavior."
verify = "uv run check and the drift test stay green and the diff touches only what the sweep scope lists."
covers = ["R5"]
after = [1, 2, 3, 4, 5, 6]
hitl = false
risk = "low"
