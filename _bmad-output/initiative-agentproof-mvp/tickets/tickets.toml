after = [{ epic = 4, needs = "the runner pipeline, parse_trace, and the engine" }, { epic = 1, needs = "the wheel build job the networkless container step installs from" }]

[[epic]]
id = 6
slug = "epic-06-json-and-html-reports"
title = "JSON and HTML reports"
description = "Every run and Replay writes a versioned JSON Report embedding redacted Events, report --format html renders a self-contained escaped page with a CSP, and golden-file tests prove byte identity on Linux and Windows after stripping volatile paths."
