# AgentProof v0.1 epics in build order. Table order is build order; ids are permanent.
# The user fixed the eleven epics and their order on 2026-10-22; after lines record what each needs.

[[epic]]
id = 1
slug = "epic-01-repository-foundation-and-ci"
title = "Repository foundation and CI"
description = "The package installs from a locally built wheel, one check entry point runs lint, format, types, import contracts, and tests, and CI runs it on Linux and Windows across Python 3.12 to 3.15 with pinned actions."
covers = ["R27", "R28", "R29", "C1", "C7", "C9", "C10"]

[[epic]]
id = 2
slug = "epic-02-data-contracts-and-schema-validation"
title = "Data contracts and schema validation"
description = "Suite, Trace, result, and Report models exist as frozen forbid-unknown Pydantic models with integer versions, Canonical and compact serializers, generated JSON Schemas with a drift test, and valid and invalid fixtures."
covers = ["R3", "R7", "R14", "R24", "R28", "C2", "C4", "C6"]
after = [{ epic = 1, needs = "the package layout, check entry point, and CI" }]

[[epic]]
id = 3
slug = "epic-03-scenario-loader-and-cli"
title = "Scenario loader and CLI"
description = "A Suite loads through the safe YAML loader with every violation reported, and the Typer app with its error handler, exit-code module, console scrubber, and the init, validate, and version commands works end to end on the scaffolded example."
covers = ["R1", "R2", "R17", "R18", "R19", "R25", "C3", "C6"]
after = [{ epic = 2, needs = "the Suite models, constants, and errors" }]

[[epic]]
id = 4
slug = "epic-04-deterministic-assertion-engine"
title = "Deterministic assertion engine"
description = "The six Assertions, the evaluation and status fold, Trace parsing, the Adapter protocol with the Fixture Agent, and the runner's run pipeline make agentproof run exit 1 on the example's failing Scenario and 0 on the passing one, with every exit code reachable by test."
covers = ["R5", "R7", "R8", "R9", "R10", "R12", "R13", "R17", "R22", "R30", "C3", "C4", "C5"]
after = [{ epic = 3, needs = "parse_suite, the CLI app, exit codes, and the console scrubber" }, { epic = 2, needs = "the Trace, result, and outcome models" }]

[[epic]]
id = 5
slug = "epic-05-trace-import-export-and-offline-replay"
title = "Trace import/export and offline replay"
description = "After the pivot interviews are recorded, run writes redacted Traces in Canonical form, Redaction runs at ingress with one rule set, trace replay re-evaluates a saved Trace with no network and no subprocess, and the secret-leak and inert-trace tests pass."
